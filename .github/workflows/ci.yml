name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Compile main and test sources
        run: ./mvnw -B -DskipTests compile test-compile

      - name: Package (skip device-bound tests)
        run: ./mvnw -B -DskipTests package

      # Full Appium suite needs an emulator + Appium server.
      # Run locally: ./mvnw test (see README).
